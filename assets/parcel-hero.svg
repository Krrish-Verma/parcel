<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Parcel — file sharing that picks up where it left off</title>
  <desc id="desc">An editorial cream banner with a dark green announcement bar, large serif headline, a resumable upload trail, and a softly faded parcel illustration</desc>

  <defs>
    <linearGradient id="boxFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8d6a1" stop-opacity=".24"/>
      <stop offset="1" stop-color="#214e43" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="trailFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#214e43" stop-opacity=".08"/>
      <stop offset=".55" stop-color="#214e43" stop-opacity=".34"/>
      <stop offset="1" stop-color="#214e43" stop-opacity=".08"/>
    </linearGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#f7f7e8"/>
  <path d="M28 0h1144a28 28 0 0 1 28 28v22H0V28A28 28 0 0 1 28 0Z" fill="#214e43"/>
  <text x="600" y="32" text-anchor="middle" fill="#f7f7e8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" letter-spacing=".25">RESUME AFTER A DROP, A RELOAD, OR A RESTART</text>

  <rect x="72" y="68" width="1056" height="54" rx="15" fill="#fbfbf0" stroke="#d9dacb" stroke-width="2"/>
  <g transform="translate(92 79)">
    <rect width="32" height="32" rx="9" fill="#214e43"/>
    <path d="M9 8h10.4c4.3 0 7.4 2.8 7.4 6.9s-3.1 6.9-7.4 6.9h-4.7v3.7H9V8Zm5.7 5v3.7h4.5c1.3 0 2.1-.7 2.1-1.8s-.8-1.9-2.1-1.9h-4.5Z" fill="#f7f7e8"/>
  </g>
  <text x="134" y="102" fill="#171a17" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="750">Parcel</text>
  <rect x="892" y="78" width="216" height="34" rx="10" fill="#e5d7f6" stroke="#171a17" stroke-width="1.5"/>
  <text x="1000" y="101" text-anchor="middle" fill="#171a17" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">BUILT TO RESUME  →</text>

  <text x="92" y="166" fill="#5e645e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" letter-spacing="2.2">RESUMABLE FILE SHARING</text>
  <text x="89" y="232" fill="#171a17" font-family="Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="-2">Send large files,</text>
  <text x="89" y="294" fill="#171a17" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" letter-spacing="-2">without starting over.</text>
  <text x="94" y="336" fill="#343a35" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Verified chunks. Honest progress. One simple link.</text>

  <g transform="translate(94 358)">
    <rect width="515" height="8" rx="4" fill="#214e43" opacity=".12"/>
    <rect width="376" height="8" rx="4" fill="#214e43" opacity=".82"/>
    <circle cx="376" cy="4" r="8" fill="#e5d7f6" stroke="#214e43" stroke-width="3"/>
    <g fill="#214e43">
      <circle cx="50" cy="4" r="2.5"/>
      <circle cx="104" cy="4" r="2.5"/>
      <circle cx="158" cy="4" r="2.5"/>
      <circle cx="212" cy="4" r="2.5"/>
      <circle cx="266" cy="4" r="2.5"/>
      <circle cx="320" cy="4" r="2.5"/>
    </g>
  </g>
  <text x="625" y="368" fill="#697069" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">73% securely confirmed</text>

  <path d="M745 384c64-71 105-93 171-92 62 1 105 34 178-9 37-22 62-61 75-102" fill="none" stroke="url(#trailFade)" stroke-width="2" stroke-dasharray="5 8"/>
  <g opacity=".16" fill="#214e43" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="1">
    <text x="761" y="366" transform="rotate(-25 761 366)">verified</text>
    <text x="841" y="323" transform="rotate(-10 841 323)">checkpointed</text>
    <text x="948" y="318" transform="rotate(12 948 318)">ready to resume</text>
  </g>

  <g transform="translate(900 145)" opacity=".28" filter="url(#softBlur)">
    <path d="M0 53 94 0l94 53-94 53L0 53Z" fill="url(#boxFade)" stroke="#214e43" stroke-opacity=".2"/>
    <path d="m0 53 94 53v105L0 158V53Z" fill="#9ccf98" fill-opacity=".33" stroke="#214e43" stroke-opacity=".18"/>
    <path d="m188 53-94 53v105l94-53V53Z" fill="#78b489" fill-opacity=".25" stroke="#214e43" stroke-opacity=".18"/>
    <path d="m62 18 94 53v39l-23-6-16 26V88L23 36l39-18Z" fill="#fbfbf0" fill-opacity=".64"/>
  </g>
  <circle cx="1088" cy="338" r="92" fill="#e5d7f6" opacity=".16"/>
</svg>
